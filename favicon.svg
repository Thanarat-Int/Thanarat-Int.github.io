<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Outer hexagon ring -->
  <polygon points="50,8 87,29 87,71 50,92 13,71 13,29"
           fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner ring (purple accent) -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.85"/>

  <!-- Glow halo -->
  <circle cx="50" cy="50" r="14" fill="#22d3ee" opacity="0.18"/>

  <!-- Center T -->
  <text x="50" y="68"
        font-family="Arial Black, Arial, sans-serif"
        font-size="40" font-weight="900"
        fill="url(#t)" text-anchor="middle">T</text>

  <!-- Hex corner dots -->
  <circle cx="50" cy="8"  r="3" fill="#22d3ee"/>
  <circle cx="87" cy="29" r="3" fill="#22d3ee"/>
  <circle cx="87" cy="71" r="3" fill="#22d3ee"/>
  <circle cx="50" cy="92" r="3" fill="#22d3ee"/>
  <circle cx="13" cy="71" r="3" fill="#22d3ee"/>
  <circle cx="13" cy="29" r="3" fill="#22d3ee"/>
</svg>
